services:
  - type: web
    name: catalogo-app
    runtime: python
    plan: free

    buildCommand: bash build.sh
    startCommand: gunicorn catalogo_app.wsgi:application --bind 0.0.0.0:$PORT

    envVars:
      - key: DJANGO_DEBUG
        value: "False"

      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"

      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"

      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"

      - key: SERVE_MEDIA
        value: "False"

      # Los archivos de productos, videos y logo se guardan directamente en
      # Cloudflare R2, no en el sistema efímero de Render.
      - key: MEDIA_STORAGE
        value: "r2"

      - key: R2_ACCOUNT_ID
        sync: false

      - key: R2_ACCESS_KEY_ID
        sync: false

      - key: R2_SECRET_ACCESS_KEY
        sync: false

      - key: R2_BUCKET_NAME
        sync: false

      # Dominio público de R2, sin https:// (por ejemplo: pub-xxx.r2.dev).
      - key: R2_PUBLIC_DOMAIN
        sync: false

      - key: R2_REGION
        value: "auto"

      - key: DATABASE_URL
        fromDatabase:
          name: catalogo-postgres
          property: connectionString

      - key: ADMIN_EMAIL
        sync: false

      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: catalogo-postgres
    plan: free
